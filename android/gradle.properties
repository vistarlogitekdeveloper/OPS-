org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Memory tuning: the daemons were being killed by system-wide commit exhaustion,
# not by their own heap limits. Compile Kotlin inside the Gradle daemon rather
# than spawning a second JVM, and cap concurrent workers.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=4
